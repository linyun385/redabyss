<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>拖动跟随偏移测试</title>
<style>
 body{margin:0;background:#111;color:#ddd;font:13px/1.6 monospace}
 #wrap{display:flex;gap:8px}
 iframe{width:900px;height:600px;border:1px solid #333;background:#000}
 #out{padding:8px;width:340px;white-space:pre-wrap}
 .ok{color:#6f6}.bad{color:#f66}
</style></head>
<body>
<div id="wrap"><iframe id="f" src="../web/index.html"></iframe><pre id="out">准备中…</pre></div>
<script>
const out=document.getElementById('out');
const log=(m,c)=>{out.innerHTML+=(c?'<span class="'+c+'">'+m+'</span>':m)+'\n';};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fire=(el,type,x,y)=>el.dispatchEvent(new PointerEvent(type,{
  bubbles:true,cancelable:true,composed:true,pointerId:1,pointerType:'mouse',isPrimary:true,
  button:0,buttons:type==='pointerup'?0:1,clientX:x,clientY:y}));

(async()=>{
  const f=document.getElementById('f');
  await new Promise(r=>f.addEventListener('load',r,{once:true}));
  const D=f.contentDocument; await sleep(300);
  const cls=[...D.querySelectorAll('button')].find(b=>/下潜者/.test(b.textContent)); cls.click(); await sleep(500);
  for(let i=0;i<8;i++){const n=D.querySelector('.mnode.pickable'); if(n){n.click(); await sleep(600);} if(D.querySelector('#hand .card')) break; await sleep(300);}
  const cards=[...D.querySelectorAll('#hand .card')];
  if(!cards.length){log('✗ 没进战斗','bad');return;}
  log('手牌 '+cards.length+' 张');

  // 测第一张和最后一张：按下后横移 120px，卡片应恰好跟着移 120px
  for (const [tag, idx] of [['第一张',0],['最后一张',cards.length-1]]) {
    const c=cards[idx]; if(!c) continue;
    const r0=c.getBoundingClientRect();
    const sx=r0.left+r0.width*0.5, sy=r0.top+r0.height*0.5;
    fire(c,'pointerdown',sx,sy); await sleep(30);
    fire(c,'pointermove',sx+10,sy);      await sleep(30);
    fire(c,'pointermove',sx+120,sy);     await sleep(60);
    const r1=c.getBoundingClientRect();
    const dxCard=Math.round((r1.left+r1.width*0.5)-sx);
    const err=Math.abs(dxCard-120);
    log(tag+'：指针 +120px，卡牌中心实际 +'+dxCard+'px（误差 '+err+'px）', err<=4?'ok':'bad');
    fire(c,'pointerup',sx+120,sy); await sleep(400);
  }
  const errTxt=out.textContent;
  log(/\bbad\b|bad"/.test(out.innerHTML)?'✗ 存在偏移':'✓ 拖动跟随正确', /bad"/.test(out.innerHTML)?'bad':'ok');
})();
</script>
</body></html>
