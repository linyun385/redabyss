<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>T53 拖拽回归测试</title>
<style>
  body{margin:0;background:#111;color:#ddd;font:13px/1.5 monospace}
  #wrap{display:flex;gap:8px}
  iframe{width:960px;height:640px;border:1px solid #333;background:#000}
  #out{padding:8px;width:300px;white-space:pre-wrap}
  .ok{color:#6f6}.bad{color:#f66}
</style>
</head>
<body>
<div id="wrap">
  <iframe id="f" src="../web/index.html"></iframe>
  <pre id="out">准备中…</pre>
</div>
<script>
const out = document.getElementById('out');
const log = (m, cls) => { out.innerHTML += (cls ? '<span class="' + cls + '">' + m + '</span>' : m) + '\n'; };
const sleep = ms => new Promise(r => setTimeout(r, ms));

function fire(el, type, x, y, extra) {
  const ev = new PointerEvent(type, Object.assign({
    bubbles: true, cancelable: true, composed: true,
    pointerId: 1, pointerType: 'mouse', isPrimary: true,
    button: 0, buttons: type === 'pointerup' ? 0 : 1,
    clientX: x, clientY: y
  }, extra || {}));
  el.dispatchEvent(ev);
}

(async () => {
  const f = document.getElementById('f');
  await new Promise(r => f.addEventListener('load', r, { once: true }));
  const W = f.contentWindow, D = f.contentDocument;
  await sleep(300);

  // 1. 选职业
  const cls = [...D.querySelectorAll('button')].find(b => /下潜者/.test(b.textContent));
  cls.click();
  await sleep(500);

  // 2. 进战斗：点第一个可点的战斗节点
  for (let i = 0; i < 8; i++) {
    const node = D.querySelector('.mnode.pickable');
    if (node) { node.click(); await sleep(600); }
    if (D.querySelector('#hand .card')) break;
    await sleep(300);
  }
  if (!D.querySelector('#hand .card')) { log('✗ 没能进入战斗', 'bad'); return; }
  log('✓ 进入战斗，手牌 ' + D.querySelectorAll('#hand .card').length + ' 张');

  const energyOf = () => {
    const t = D.querySelector('#hud') ? D.querySelector('#hud').textContent : '';
    const m = t.match(/能量\s*(\d+)\s*\/\s*(\d+)/);
    return m ? +m[1] : null;
  };
  const enemy = D.querySelector('#enemy-area .enemy:not(.dead)');
  if (!enemy) { log('✗ 没有活着的敌人', 'bad'); return; }
  const eb = enemy.getBoundingClientRect();

  // 3. 找一张能打出的手牌，做一次「拖到敌人身上」
  const cards = [...D.querySelectorAll('#hand .card')];
  let target = null, idx = -1;
  cards.forEach((c, i) => {
    if (!target && !c.classList.contains('dimmed') && !c.classList.contains('wrongworld')) { target = c; idx = i; }
  });
  if (!target) { log('✗ 没有可打出的牌（全 dimmed）', 'bad'); return; }
  const before = energyOf();
  const rb = target.getBoundingClientRect();
  const sx = rb.left + rb.width * 0.5, sy = rb.top + rb.height * 0.5;
  const tx = eb.left + eb.width * 0.5, ty = eb.top + eb.height * 0.5;
  log('拖拽：牌#' + idx + ' (' + Math.round(sx) + ',' + Math.round(sy) + ') → 敌人 (' + Math.round(tx) + ',' + Math.round(ty) + ')');
  log('能量(前) ' + before);

  fire(target, 'pointerdown', sx, sy);
  await sleep(30);
  fire(target, 'pointermove', sx + (tx - sx) * 0.5, sy + (ty - sy) * 0.5);
  await sleep(30);
  fire(target, 'pointermove', tx, ty);
  await sleep(30);
  const hit = D.elementFromPoint(tx, ty);
  log('落点命中：' + (hit ? (hit.className || hit.tagName) : 'null'));
  fire(target, 'pointerup', tx, ty);
  await sleep(700);

  const after = energyOf();
  const handNow = D.querySelectorAll('#hand .card').length;
  log('能量(后) ' + after);
  log('手牌数 ' + handNow + '（拖出成功通常会减少或换牌）');
  const logs = [...D.querySelectorAll('#log div')].slice(-4).map(d => d.textContent).join(' | ');
  log('战斗日志尾部：' + logs);

  const played = (before !== null && after !== null && after < before) || handNow !== cards.length ||
                 /造成|伤害|格挡|打出/.test(logs);
  log(played ? '✓ 拖拽出牌路径生效' : '✗ 拖拽没有触发出牌', played ? 'ok' : 'bad');

  // 4. 判定区宽容度测试：拖到敌人【下方 90px】（在 70~170px 判定区内，但不在敌人元素上）
  const cards2 = [...D.querySelectorAll('#hand .card')];
  let t2 = null, i2 = -1;
  cards2.forEach((c, i) => {
    if (!t2 && !c.classList.contains('dimmed') && !c.classList.contains('wrongworld')) { t2 = c; i2 = i; }
  });
  if (!t2) { log('（没有可打出的牌，跳过宽容度测试）'); return; }
  const en2 = D.querySelector('#enemy-area .enemy:not(.dead)');
  if (!en2) { log('（敌人已死，跳过宽容度测试）'); return; }
  const aliveN = D.querySelectorAll('#enemy-area .enemy:not(.dead)').length;
  const give = aliveN === 1 ? 170 : 70;
  const eb2 = en2.getBoundingClientRect();
  const r2 = t2.getBoundingClientRect();
  const bx = r2.left + r2.width * 0.5, by = r2.top + r2.height * 0.5;
  const off = Math.min(give - 10, 90);
  const gx = eb2.left + eb2.width * 0.5, gy = eb2.bottom + off;   // 敌人矩形下方 off 像素
  const eBefore = energyOf();
  log('宽容度测试：落点 = 敌人下方 ' + off + 'px（判定区 ' + give + 'px，落点不在敌人元素上）');
  fire(t2, 'pointerdown', bx, by);
  await sleep(30);
  fire(t2, 'pointermove', gx, gy);
  await sleep(30);
  const hit2 = D.elementFromPoint(gx, gy);
  log('该点真实命中元素：' + (hit2 ? (hit2.className || hit2.tagName) : 'null') + '（不是敌人也能判定成功才对）');
  fire(t2, 'pointerup', gx, gy);
  await sleep(700);
  const eAfter = energyOf();
  const ok2 = (eBefore !== null && eAfter !== null && eAfter < eBefore);
  log(ok2 ? '✓ 判定区宽容生效（敌人外 ' + off + 'px 也算命中）' : '✗ 判定区没有宽容', ok2 ? 'ok' : 'bad');
})();
</script>
</body>
</html>
